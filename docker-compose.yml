services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_secret_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "7392:7392"
    environment:
      DATABASE_URL: "postgresql://rag_user:rag_secret_password@postgres:5432/rag_db"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      AUTH_SECRET: "${AUTH_SECRET}"
    depends_on:
      - postgres

volumes:
  pgdata:

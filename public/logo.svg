<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="ql-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e132b" />
      <stop offset="60%" stop-color="#0e0a17" />
      <stop offset="100%" stop-color="#06040a" />
    </radialGradient>
    <linearGradient id="ql-stroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.55)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.10)" />
    </linearGradient>
    <linearGradient id="ql-feather" x1="120" y1="100" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ql-nib" x1="200" y1="260" x2="260" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="ql-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ql-bg)" stroke="url(#ql-stroke)" stroke-width="6" />
  <circle cx="256" cy="256" r="130" fill="#8b5cf6" opacity="0.14" filter="url(#ql-glow)" />

  <g transform="translate(0, -6)">
    <!-- Neural Chatbot Wave Halo (RAG Knowledge Field) -->
    <path d="M 120 280 C 150 200 200 150 280 130" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <path d="M 140 320 C 180 230 240 180 340 160" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.4" />

    <!-- Stylized Aerodynamic Quill Feather Spine -->
    <path d="M 370 100 C 370 100 220 140 180 270 C 160 330 184 390 184 390 C 184 390 230 350 260 300 C 310 210 370 100 370 100 Z" 
          fill="url(#ql-feather)" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linejoin="round" />

    <!-- Secondary Quill Vane (Dynamic Neural Feather Facet) -->
    <path d="M 370 100 C 340 180 320 240 280 290 C 270 270 280 230 300 190 Z" 
          fill="#c084fc" opacity="0.85" />

    <!-- Precision Precision Writing Nib Point -->
    <polygon points="184,390 168,416 196,406" fill="url(#ql-nib)" filter="url(#ql-glow)" />
    <!-- Nib Ink Slit -->
    <line x1="184" y1="390" x2="176" y2="408" stroke="#0e0a17" stroke-width="2" stroke-linecap="round" />

    <!-- Chat Prompt Signal Nodes -->
    <circle cx="370" cy="100" r="7" fill="#ffffff" filter="url(#ql-glow)" />
    <circle cx="280" cy="130" r="5" fill="#c084fc" />
    <circle cx="340" cy="160" r="5" fill="#38bdf8" />
  </g>
</svg>

